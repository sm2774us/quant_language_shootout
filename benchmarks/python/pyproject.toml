[project]
name = "quant-lang-shootout-python"
version = "1.0.0"
description = "Python leg of the systematic trading language shootout benchmark suite."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pylint>=3.2",
]

[tool.pylint.format]
max-line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ring_buffer", "vwap", "ewma", "mc_gpu", "bench"]
