[package]
name = "quant-lang-shootout"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Rust leg of the systematic trading language shootout benchmark suite."
license = "MIT"

[[bin]]
name = "bench"
path = "src/bench.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
